version: 2

models:
  - name: fct_orders
    description: >
      Order-level fact table.
      Grain: one row per order.

    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null

      - name: status
        data_tests:
          - not_null

  - name: fct_order_items
    description: >
      Item-level fact table.
      Grain: one row per item within an order.

    columns:
      - name: order_id
        data_tests:
          - not_null

      - name: item_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null

      - name: seller_id
        data_tests:
          - not_null

      - name: price
        data_tests:
          - not_null

      - name: freight_value
        data_tests:
          - not_null