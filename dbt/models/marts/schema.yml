version: 2

models:
  - name: fct_orders
    description: >
      Order-level fact table.
      Grain: one row per order.

    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null

      - name: status
        data_tests:
          - not_null

  - name: fct_order_items
    description: >
      Item-level fact table.
      Grain: one row per item within an order.

    columns:
      - name: order_id
        data_tests:
          - not_null

      - name: item_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null

      - name: seller_id
        data_tests:
          - not_null

      - name: price
        data_tests:
          - not_null

      - name: freight_value
        data_tests:
          - not_null

  - name: dim_products
    description: >
      Product dimension containing descriptive attributes for each product.
      Grain: one row per product.

    columns:
      - name: id
        data_tests:
          - unique
          - not_null

  - name: business_metrics_orders
    description: >
      Daily business metrics aggregated from orders.
      Grain: one row per order date.

    columns:
      - name: order_date
        description: Calendar date associated with the orders.
        data_tests:
          - not_null

      - name: total_orders
        description: Number of orders placed on the order date.
        data_tests:
          - not_null

      - name: total_revenue
        description: Sum of payment amounts for orders placed on the order date.

      - name: average_order_value
        description: Average payment amount per order on the order date.

      - name: average_delivery_days
        description: Average number of days taken to deliver orders placed on the order date.

      - name: average_review_score
        description: Average review score for orders placed on the order date.

      - name: late_orders
        description: Number of orders delivered after the estimated delivery date.

      - name: orders_not_late
        description: Number of orders delivered on time or early.
