version: 2

models:
  - name: fct_orders
    description: >
      Order-level fact table.
      Grain: one row per order.

    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null

      - name: status
        data_tests:
          - not_null